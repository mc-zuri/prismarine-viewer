<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bedrock blocks</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; font-family: sans-serif; font-size: 14px; }
      #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 10px; background: rgba(20, 24, 28, 0.85); color: #e8e8e8; }
      #bar label { display: flex; gap: 4px; align-items: center; }
      #filter { width: 22em; }
      #tilt { width: 4em; }
      #view { position: absolute; inset: 0; }
      #info { position: absolute; left: 10px; bottom: 10px; z-index: 1; max-width: 60%; padding: 6px 10px; background: rgba(20, 24, 28, 0.85); color: #e8e8e8; white-space: pre-wrap; font-family: monospace; }
      #info:empty { display: none; }
      a { color: #8cc8ff; }
    </style>
  </head>
  <body>
    <div id="bar">
      <a href="index.html">Bedrock preview</a>
      <label>Version <select id="version"></select></label>
      <label title="words of the block's name, and state=value of its states (a part of the state's name will do): all must match">Filter <input id="filter" type="text" placeholder="e.g. stairs  upside_down_bit=1"></label>
      <label>Show <select id="show">
        <option value="states">every state</option>
        <option value="blocks">one state per block</option>
      </select></label>
      <label>Per page <select id="pageSize">
        <option>24</option>
        <option selected>48</option>
        <option>96</option>
        <option>192</option>
      </select></label>
      <button id="prev">&lt;</button>
      <span id="page"></span>
      <button id="next">&gt;</button>
      <label>Biome <select id="biome"></select></label>
      <label><input id="spin" type="checkbox" checked> spin</label>
      <label title="how far the blocks lean towards you as they spin: at 45° every face shows in one turn">tilt <input id="tilt" type="number" value="45" min="0" max="90" step="5">°</label>
      <button id="toGrid">blocks</button>
      <button id="toBiomes" title="still and flowing water, lava, grass, leaves and other plants, in several biomes">water and plants by biome</button>
      <span id="status"></span>
    </div>
    <div id="view"></div>
    <div id="info"></div>
    <script src="blocks.js"></script>
  </body>
</html>
