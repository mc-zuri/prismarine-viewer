<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bedrock gameplay</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; font-family: sans-serif; font-size: 14px; }
      #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 10px; background: rgba(20, 24, 28, 0.85); color: #e8e8e8; }
      #bar label { display: flex; gap: 4px; align-items: center; }
      #sensitivity { width: 80px; }
      #view { position: absolute; inset: 0; }
      .hud { position: absolute; z-index: 1; pointer-events: none; }
      #crosshair { left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; }
      #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); mix-blend-mode: difference; }
      #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
      #crosshair::after { left: 0; top: 8px; width: 18px; height: 2px; }
      #hotbar { left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; background: rgba(20, 24, 28, 0.6); }
      #hotbar .slot { width: 44px; height: 44px; box-sizing: border-box; border: 2px solid #5a5a5a; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 9px; line-height: 1.1; color: #ddd; text-align: center; }
      #hotbar .slot.selected { border-color: #f0f0f0; }
      #hotbar canvas { width: 32px; height: 32px; image-rendering: pixelated; }
      #chat { left: 10px; bottom: 70px; width: 40%; max-height: 40%; display: flex; flex-direction: column; justify-content: flex-end; }
      #log div { width: fit-content; max-width: 100%; padding: 1px 6px; background: rgba(0, 0, 0, 0.45); color: #fff; white-space: pre-wrap; }
      #say { display: none; pointer-events: auto; margin-top: 4px; padding: 4px 6px; border: 0; background: rgba(0, 0, 0, 0.7); color: #fff; font: inherit; }
      #stats, #debug { top: calc(var(--bar, 40px) + 8px); padding: 6px 10px; background: rgba(20, 24, 28, 0.75); color: #e8e8e8; font: 12px monospace; white-space: pre; }
      #stats { right: 10px; }
      #debug { left: 10px; }
      #stats:empty, #debug:empty, #info:empty { display: none; }
      #info { right: 10px; bottom: 10px; max-width: 30%; padding: 6px 10px; background: rgba(20, 24, 28, 0.85); color: #e8e8e8; white-space: pre-wrap; }
      a { color: #8cc8ff; }
      #modes { display: flex; gap: 2px; align-items: center; }
      #modes button[aria-pressed="true"] { background: #4a6d8c; color: #fff; border-color: #8cc8ff; }
      #pathfinder { position: relative; }
      #pathfinder summary { cursor: pointer; }
      #pathfinder .panel { position: absolute; top: 100%; right: 0; width: max-content; max-width: calc(100vw - 32px); margin-top: 4px; padding: 8px 12px; display: grid; grid-template-columns: repeat(2, auto); gap: 4px 16px; background: rgba(20, 24, 28, 0.92); border: 1px solid #3a434d; border-radius: 6px; }
      #pathfinder .panel label { display: flex; gap: 4px; align-items: center; }
      #pathfinder input[type=number] { width: 44px; }
      #pathfinder .legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 0; padding: 6px 0 0; list-style: none; border-top: 1px solid #3a434d; font-size: 12px; }
      #pathfinder .legend li { display: flex; gap: 5px; align-items: center; }
      #pathfinder .legend span { display: inline-block; width: 14px; height: 4px; }
      #pathfinder .legend span.mark { width: 8px; height: 8px; }
      #pathfinder .legend span.block { width: 10px; height: 10px; box-sizing: border-box; border: 2px solid; background: none !important; }
      #pathfinder .note { grid-column: 1 / -1; margin: 0; font-size: 12px; color: #a7b0bb; }
      #hint { left: 50%; bottom: 70px; transform: translateX(-50%); padding: 4px 10px; border-radius: 4px; background: rgba(0, 0, 0, 0.55); color: #fff; white-space: nowrap; }
      #hint:empty, #crosshair[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="bar">
      <a href="index.html">Bedrock preview</a>
      <label>Version <select id="version"></select></label>
      <label title="the showcase, or a world recorded and imported (worldImport.js)">World <select id="world"><option value="">showcase</option></select></label>
      <label title="client_cache_status: sections and biomes as blobs the client keeps, sent once"><input id="cache" type="checkbox" checked> blob cache</label>
      <label title="start_game's block_network_ids_are_hashes (1.19.80 on)"><input id="hashes" type="checkbox"> hashed block ids</label>
      <button id="join">Join</button>
      <button id="leave">Leave</button>
      <span id="modes" role="group" aria-label="View" title="V (F5 with the mouse locked): first or third person">View
        <button data-mode="first" aria-pressed="false">First</button>
        <button data-mode="third" aria-pressed="false">Third</button>
        <button data-mode="walk" aria-pressed="false" title="a click on the world walks the player there with the pathfinder">Walk</button>
      </span>
      <details id="pathfinder">
        <summary>Pathfinder</summary>
        <div class="panel">
          <p class="note">In the walk view, a click on the world walks the player there; a key or Escape stops it.</p>
          <label title="Breaks the blocks in the way (in creative, at once)"><input type="checkbox" data-option="dig"> Break blocks</label>
          <label title="Places blocks of the hotbar to bridge a gap or pillar up"><input type="checkbox" data-option="place"> Place blocks</label>
          <label title="Jumps across gaps: one block walking, up to three sprinting"><input type="checkbox" data-option="parkour"> Parkour</label>
          <label title="Sprints where the way is straight"><input type="checkbox" data-option="sprint"> Sprint</label>
          <label title="Opens the fence gates in the way"><input type="checkbox" data-option="openGates"> Open gates</label>
          <label title="Plans around the entities in the way"><input type="checkbox" data-option="avoidEntities"> Avoid entities</label>
          <label title="Turns as a person does, eyes on the route ahead; walks once facing the way, breaks and places once the crosshair is on the block"><input type="checkbox" data-option="humanLike"> Human-like</label>
          <label title="In creative, flies where that is quicker: takes off with a double jump and lands with another"><input type="checkbox" data-option="fly"> Fly</label>
          <label title="With an elytra worn, out of creative, glides where that is quicker, boosted by the firework rockets of the hotbar"><input type="checkbox" data-option="glide"> Glide</label>
          <label title="The highest drop it walks off: more than 3 hurts in survival">Max drop <input type="number" id="max-drop" min="0" max="16" step="1"></label>
          <ul class="legend" aria-label="Route colours">
            <li><span data-color="walking"></span>walk</li>
            <li><span data-color="partial"></span>as near as found</li>
            <li><span data-color="air"></span>in the air</li>
            <li><span data-color="takeOff" class="mark"></span>jump</li>
            <li><span data-color="landing" class="mark"></span>landing</li>
            <li><span data-color="breaks" class="block"></span>break</li>
            <li><span data-color="places" class="block"></span>place</li>
            <li><span data-color="opens" class="block"></span>open</li>
          </ul>
        </div>
      </details>
      <label>Mouse <input id="sensitivity" type="range" min="1" max="20"></label>
      <span id="status"></span>
    </div>
    <div id="view"></div>
    <div id="crosshair" class="hud" hidden></div>
    <div id="hint" class="hud"></div>
    <div id="debug" class="hud"></div>
    <div id="stats" class="hud"></div>
    <div id="chat" class="hud"><div id="log"></div><input id="say" maxlength="256" autocomplete="off"></div>
    <div id="hotbar" class="hud"></div>
    <div id="info" class="hud"></div>
    <script src="gameplay.js"></script>
  </body>
</html>
