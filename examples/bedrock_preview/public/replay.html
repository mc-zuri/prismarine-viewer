<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bedrock replay</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; font-family: sans-serif; font-size: 14px; }
      #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 10px; background: rgba(20, 24, 28, 0.85); color: #e8e8e8; }
      #bar label { display: flex; gap: 4px; align-items: center; }
      #view { position: absolute; inset: 0; }
      #info { position: absolute; left: 10px; bottom: 10px; z-index: 1; max-width: 60%; padding: 6px 10px; background: rgba(20, 24, 28, 0.85); color: #e8e8e8; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
      #info:empty { display: none; }
      #time { min-width: 110px; font-variant-numeric: tabular-nums; }
      a { color: #8cc8ff; }
    </style>
  </head>
  <body>
    <div id="bar">
      <a href="index.html">Bedrock preview</a>
      <label>Recording <select id="recording"></select></label>
      <button id="play">pause</button>
      <button id="restart">restart</button>
      <label>Speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
      <label>Follow <select id="follow"><option value="">(start)</option></select></label>
      <span id="time"></span>
      <span id="status"></span>
    </div>
    <div id="view"></div>
    <div id="info"></div>
    <script src="replay.js"></script>
  </body>
</html>
