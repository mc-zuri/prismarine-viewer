<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bedrock showcase</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; font-family: sans-serif; font-size: 14px; }
      #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 10px; background: rgba(20, 24, 28, 0.85); color: #e8e8e8; }
      #bar label { display: flex; gap: 4px; align-items: center; }
      #tour button { margin: 0 2px; }
      #view { position: absolute; inset: 0; }
      #info { position: absolute; left: 10px; bottom: 10px; z-index: 1; max-width: 50%; padding: 6px 10px; background: rgba(20, 24, 28, 0.85); color: #e8e8e8; white-space: pre-wrap; }
      #info:empty { display: none; }
      a { color: #8cc8ff; }
    </style>
  </head>
  <body>
    <div id="bar">
      <a href="index.html">Bedrock preview</a>
      <label>Version <select id="version"></select></label>
      <span id="tour"></span>
      <label><input id="move" type="checkbox" checked> entities move</label>
      <label><input id="turn" type="checkbox"> turn</label>
      <span id="status"></span>
    </div>
    <div id="view"></div>
    <div id="info"></div>
    <script src="world.js"></script>
  </body>
</html>
